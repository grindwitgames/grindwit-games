name: Rename to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "grindwitgames"
          git config user.email "grindwitgames@gmail.com"
          git mv grindwit-games.html index.html
          git commit -m "Rename grindwit-games.html to index.html"
          git push
